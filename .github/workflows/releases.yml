name: Releases

# A release file must match its recipe commit and pin a public image whose labels and build provenance agree.
on:
  pull_request:
    paths: ["recipes/*/releases/**", "tools/check_release.py", ".github/workflows/releases.yml"]
  push:
    branches: [main]
    paths: ["recipes/*/releases/**", "tools/check_release.py", ".github/workflows/releases.yml"]

permissions:
  contents: read
  attestations: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release files match their recipes and images
        run: python3 tools/check_release.py
      - name: Images carry this repository's build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for file in recipes/*/releases/*.json; do
            image=$(jq -r .image "$file")
            echo "$file: $image"
            gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" --format json > /dev/null
          done
