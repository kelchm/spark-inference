name: Build images

# Build once: a pull request from this repository builds its exact head commit and publishes the image by digest,
# so merging rebuilds nothing; a release pins that digest. Pull requests from forks build without credentials and
# publish nothing. A manual run rebuilds the current main.
on:
  pull_request:
    paths: ["models/**", ".github/workflows/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        model: [glm53]
    permissions:
      contents: read
    uses: ./.github/workflows/image.yml
    with:
      model: ${{ matrix.model }}
      publish: false

  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        model: [glm53]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      model: ${{ matrix.model }}
      publish: true
